# ============================================================================
# requirements.lock —— 运行时依赖全钉版清单（A7：可复现构建）
#
# 生成方式：干净 venv 里解析 requirements.txt 后 pip freeze（含全部传递依赖）：
#   python3 -m venv /tmp/lockenv
#   /tmp/lockenv/bin/pip install --upgrade pip
#   /tmp/lockenv/bin/pip install -r server/requirements.txt
#   /tmp/lockenv/bin/pip freeze --all --exclude pip --exclude setuptools \
#     | sort -f > server/requirements.lock   # （保留本文件头注释）
#
# 再生成：升级依赖时重复上述步骤，并跑通 `make verify` 后一并提交。
# 本次生成环境：Python 3.11（容器内无 3.12；已验证该组合下应用可导入、
# 附件套件全绿；清单内各包均同时支持 3.11/3.12，CI（3.12）会再次验证）。
# 约束真源仍是 requirements.txt（区间声明）；本文件是它的一次可复现快照，
# 两者同时存在：镜像与 CI 装 lock，人工开发装哪个都能跑。
# ============================================================================
