<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>县域医共体 · 居民服务</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%95%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/m/m.css">
</head>
<body>
<header class="m-header">
  <h1>县域医共体 · 居民服务</h1>
  <button id="btn-logout" class="link-btn hidden">退出</button>
</header>

<main id="m-main">
  <!-- 健康宣教（无需登录） -->
  <section id="tab-edu" class="tab-page">
    <!-- 价格公示放在免登录页：公示本来就是给不特定公众看的，
         塞进登录后的"在线服务"等于没公示 -->
    <details class="m-card fold" id="price-fold">
      <summary>医疗服务价格公示</summary>
      <div class="fold-body">
        <input id="price-search" placeholder="搜索项目名称，如 CT">
        <div id="price-list">展开后加载…</div>
      </div>
    </details>
    <div id="edu-list" class="list">加载中…</div>
  </section>

  <!-- 我的档案：未登录→登录，已登录未实名→实名绑定，已实名→档案 -->
  <section id="tab-archive" class="tab-page hidden">

    <!-- 1. 登录 -->
    <div id="pane-login" class="hidden">
      <div class="m-card">
        <button id="btn-wechat" class="wechat-btn"><span class="wx">✆</span>微信一键登录</button>
        <div class="divider"><span>或使用手机号登录</span></div>
        <form id="sms-form">
          <input id="in-phone" type="tel" inputmode="numeric" maxlength="11" placeholder="手机号" required>
          <div class="code-row">
            <input id="in-code" type="text" inputmode="numeric" maxlength="6" placeholder="6位验证码" required>
            <button type="button" id="btn-send-code" class="ghost-btn">获取验证码</button>
          </div>
          <button type="submit">登录</button>
        </form>
        <p id="login-msg" class="msg"></p>
        <p class="hint tips">登录仅验证手机号归属，需完成实名绑定后才能查看健康档案。</p>
      </div>
    </div>

    <!-- 2. 实名绑定 -->
    <div id="pane-bind" class="hidden">
      <form id="bind-form" class="m-card">
        <p class="hint">首次使用需实名绑定，核对姓名与身份证号后关联您的健康档案</p>
        <input id="in-name" placeholder="姓名" required>
        <input id="in-idcard" placeholder="身份证号" required>
        <button type="submit">绑定我的档案</button>
        <p id="bind-msg" class="msg"></p>
      </form>
    </div>

    <!-- 3. 档案 -->
    <div id="pane-archive" class="hidden">
      <div id="account-bar" class="account-bar"></div>
      <div id="family-switch" class="chips"></div>
      <details id="family-add" class="m-card fold">
        <summary>添加家庭成员（代管老人/儿童档案）</summary>
        <form id="family-form">
          <input id="fm-name" placeholder="成员姓名" required>
          <input id="fm-idcard" placeholder="成员身份证号" required>
          <select id="fm-relation">
            <option value="child">子女</option>
            <option value="parent">父母</option>
            <option value="spouse">配偶</option>
            <option value="other">其他</option>
          </select>
          <div id="fm-code-row" class="code-row hidden">
            <input id="fm-code" maxlength="6" placeholder="成员手机收到的验证码">
            <button type="button" id="fm-send-code" class="ghost-btn">获取验证码</button>
          </div>
          <button type="submit">添加</button>
          <p id="family-msg" class="msg"></p>
        </form>
      </details>
      <div id="archive-result"></div>
    </div>
  </section>

  <!-- 在线服务：预约 / 签约 / 账单 / 转诊 -->
  <section id="tab-service" class="tab-page hidden">
    <div id="service-guard" class="m-card hidden">
      <p class="hint">请先在「我的档案」登录并完成实名绑定后再使用在线服务。</p>
      <button type="button" id="btn-service-login">去登录</button>
    </div>
    <div id="service-body" class="hidden">
      <div class="seg">
        <button class="seg-btn active" data-svc="appointment">预约</button>
        <button class="seg-btn" data-svc="contract">签约</button>
        <button class="seg-btn" data-svc="inpatient">住院</button>
        <button class="seg-btn" data-svc="surgery">手术</button>
        <button class="seg-btn" data-svc="bill">账单</button>
        <button class="seg-btn" data-svc="referral">转诊</button>
      </div>
      <div id="service-result"></div>
    </div>
  </section>

  <!-- 满意度评价（登录态） -->
  <section id="tab-survey" class="tab-page hidden">
    <div id="survey-guard" class="m-card hidden">
      <p class="hint">请先在「我的档案」登录并完成实名绑定后再提交评价。</p>
      <button type="button" id="btn-goto-login">去登录</button>
    </div>
    <form id="survey-form" class="m-card hidden">
      <p class="hint">对签约服务 / 就诊 / 会诊进行满意度评价</p>
      <select id="sv-type">
        <option value="contract">家医签约服务</option>
        <option value="encounter">就诊体验</option>
        <option value="consultation">远程会诊</option>
      </select>
      <div id="sv-stars" class="stars" data-score="5">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
      <textarea id="sv-comment" placeholder="意见与建议（选填）" rows="3"></textarea>
      <button type="submit">提交评价</button>
      <p id="survey-msg" class="msg"></p>
    </form>
  </section>

  <!-- 站内消息（登录态） -->
  <section id="tab-notify" class="tab-page hidden">
    <div id="notify-guard" class="m-card hidden">
      <p class="hint">请先在「我的档案」登录并完成实名绑定后再查看消息。</p>
      <button type="button" id="btn-notify-login">去登录</button>
    </div>
    <div id="notify-box"></div>
  </section>
</main>

<nav class="m-tabbar">
  <a href="#edu" class="tab-btn active" data-tab="edu"><span class="ico">📖</span>健康宣教</a>
  <a href="#archive" class="tab-btn" data-tab="archive"><span class="ico">📋</span>我的档案</a>
  <a href="#service" class="tab-btn" data-tab="service"><span class="ico">🗓️</span>在线服务</a>
  <a href="#notify" class="tab-btn" data-tab="notify"><span class="ico">🔔</span>消息<span id="notify-dot" class="dot hidden"></span></a>
  <a href="#survey" class="tab-btn" data-tab="survey"><span class="ico">⭐</span>满意度</a>
</nav>

<script src="/static/m/m.js"></script>
</body>
</html>
