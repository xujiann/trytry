<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>县域医共体信息化平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%95%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="login-view" class="login-wrap hidden">
  <form id="login-form" class="login-card">
    <h1>县域医共体信息化平台</h1>
    <p class="sub">紧密型县域医共体 · 管理端</p>
    <input id="login-username" placeholder="用户名" autocomplete="username" required>
    <input id="login-password" type="password" placeholder="密码" autocomplete="current-password" required>
    <button type="submit">登 录</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app-view" class="app hidden">
  <aside class="sidebar">
    <div class="brand">医共体平台</div>
    <nav id="nav"></nav>
    <button id="logout" class="logout">退出登录</button>
  </aside>
  <div id="todo-bell" class="todo-bell hidden" title="待办中心">🔔<span id="todo-count" class="todo-count hidden">0</span>
    <div id="todo-panel" class="todo-panel hidden"></div>
  </div>
  <main id="main" class="main"></main>
</div>

<!-- 阶段十二：按顶层块边界拆成 5 个文件，不引入构建工具。
     加载顺序有含义：公共层最先，页面文件居中，注册表与启动最后
     （注册表求值时就要拿到每个 renderX 的引用，而函数提升只在文件内生效）。 -->
<script src="/static/core.js"></script>
<script src="/static/pages-clinical.js"></script>
<script src="/static/pages-public.js"></script>
<script src="/static/pages-mgmt.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
