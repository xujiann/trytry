# 一键启动：应用 + PostgreSQL 16 + Redis 7（命名卷持久化）
#
# 用法（三个密钥**必须**先设好，否则 compose 直接报错退出）：
#   export MEDPLAT_SECRET=$(python -c 'import secrets;print(secrets.token_hex(32))')
#   export MEDPLAT_ADMIN_PASSWORD='<强口令，≥12 位>'
#   export MEDPLAT_DB_PASSWORD=$(python -c 'import secrets;print(secrets.token_hex(16))')
#   docker compose up -d
#
# 为什么不给默认值：本文件里 `MEDPLAT_ENV: prod`。此前写的是
# `${MEDPLAT_SECRET:-change-me-in-production}`，于是不设任何环境变量也能起来——
# 起来的是一个**用仓库里人人可见的字符串签 JWT** 的生产实例，谁都能离线伪造令牌。
# 而应用侧的守卫当时只比对"是否等于代码里的默认值"，这个占位符恰好不等于它，
# 一路放行。现在改成 `:?` 形态：没设就报错退出，不给"不小心跑起来"的机会。
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MEDPLAT_DATABASE_URL: postgresql+psycopg2://medplat:${MEDPLAT_DB_PASSWORD:?请先设置 MEDPLAT_DB_PASSWORD（数据库口令）}@db:5432/medplat
      MEDPLAT_REDIS_URL: redis://redis:6379/0
      MEDPLAT_SECRET: ${MEDPLAT_SECRET:?请先设置 MEDPLAT_SECRET（≥32 位强随机，用于 JWT 签名）}
      MEDPLAT_ADMIN_PASSWORD: ${MEDPLAT_ADMIN_PASSWORD:?请先设置 MEDPLAT_ADMIN_PASSWORD（≥12 位强口令）}
      MEDPLAT_UPLOAD_DIR: /data/uploads
      MEDPLAT_ENV: prod
      # A8：镜像默认已**不带**演示种子（Dockerfile 不再 ENV MEDPLAT_SEED_DEMO=1）。
      # 生产档保持 0；要起演示档需**显式**开：export MEDPLAT_SEED_DEMO=1 再 up，
      # 演示数据均为虚构，不得对公网生产库开启。
      MEDPLAT_SEED_DEMO: "${MEDPLAT_SEED_DEMO:-0}"
    volumes:
      - medplat-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 健康检查：镜像自带 HEALTHCHECK（python 探测 /api/health）；此处显式声明同一探针，
    # 让不读 Dockerfile 的人在 compose 里也看得见，且 `docker compose ps` 有健康态。
    healthcheck:
      test: ["CMD", "python", "-c", "import os,httpx;httpx.get('http://127.0.0.1:%s/api/health' % os.environ.get('PORT','8000'),timeout=4).raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # A8：资源上限——单体 + 多 worker 失控时别把宿主机拖死（compose v2 非 swarm 也生效）
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medplat
      POSTGRES_PASSWORD: ${MEDPLAT_DB_PASSWORD:?请先设置 MEDPLAT_DB_PASSWORD（数据库口令）}
      POSTGRES_DB: medplat
    volumes:
      - medplat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medplat -d medplat"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7
    # AOF 持久化：黑名单/锁定状态重启不丢；生产建议再加 --requirepass 并同步改 MEDPLAT_REDIS_URL
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - medplat-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  medplat-pgdata:
  medplat-redisdata:
  medplat-uploads:
