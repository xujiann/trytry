name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # CI 解释器版本，**与生产镜像同版**（根与 `server/` 两个 Dockerfile 都是
  # python:3.12-slim），也与 `pyproject.toml` 里 ruff `target-version` /
  # mypy `python_version` 一致。此前 CI 装 3.11 而生产跑 3.12——测的和发的不是
  # 同一个解释器，且 lint/typecheck 按 3.12 语义检查、测试按 3.11 语义执行，
  # 两个阻断门的口径对不上。改这里之前请先在目标版本上跑通 `make verify`。
  PYTHON_VERSION: "3.12"
  # 块5：覆盖率门禁阈值（ADR-0002 落地时实测 87%，门槛 70% 留有余量）。
  # 强制门禁：低于阈值阻断构建。
  COVERAGE_MIN: "70"

jobs:
  # unit + smoke（阻断）+ integration（真 PG，阻断——ADR-0002 迁移门）
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medplat_pg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
      # 执行锁的 Lua（比对后删 / 比对后续期）此前只有假 redis 验逻辑——
      # 那证明不了脚本本身写对了，也证明不了 SET NX EX 的真实语义。
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies (locked)
        # A7：按 lock 安装——CI 测的和镜像里装的是**同一组版本**，可复现
        run: pip install -r server/requirements.lock
      - name: Run unit + smoke tests with coverage
        working-directory: server
        # 端到端测试（tests/e2e，标记 e2e）默认跳过，需 --e2e 且已安装浏览器内核
        # 集成测试（标记 integration）此处排除，改由下一步在真 PG 上跑
        run: |
          python -m pytest tests/ -q -m "not integration and not e2e" \
            --cov=app --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Run integration tests on real PostgreSQL (blocking)
        working-directory: server
        # SQLite 测不出的方言/迁移敏感点。ADR-0002：强制门禁，失败阻断构建。
        env:
          MEDPLAT_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/medplat_pg_test
          # 用 1 号库：与应用默认的 0 号隔开，别让用例的清理动作碰到别的东西
          MEDPLAT_REDIS_TEST_URL: redis://127.0.0.1:6379/1
        # --junitxml：让下一步能查"到底跑了几条"。集成档全靠 skipif 开关，
        # 一旦连接串没传进来，**整档静默跳过而这一步照样绿**——这正是本轮要堵的假绿。
        run: python -m pytest tests/ -q -m integration --junitxml=integration.xml
      - name: Integration gate self-check (集成档必须真的跑过)
        working-directory: server
        # 闸门要自证覆盖面（第 17 章 §17.5 第 4 条）：把"收集多少、跳过多少、
        # 真正执行多少"打印出来，并在**一条都没跑**时阻断——
        # 集成档默认 skip，"没跑"和"跑过且全对"在退出码上长得一模一样。
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("integration.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          ran = tests - skipped
          print(f"::notice title=Integration coverage::集成档收集 {tests} 条、跳过 {skipped} 条、真正执行 {ran} 条")
          for case in suite.iter("testcase"):
              if case.find("skipped") is not None:
                  print(f"::warning title=Integration skipped::{case.get('classname')}::{case.get('name')}")
          if ran <= 0:
              print("::error title=Integration gate not running::集成档一条都没执行（多半是 MEDPLAT_PG_TEST_URL 没传进来），这一步的绿灯没有意义")
              sys.exit(1)
          PY
      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-junit
          path: server/integration.xml
          if-no-files-found: ignore
      - name: Coverage gate (blocking)
        working-directory: server
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          threshold = float("${{ env.COVERAGE_MIN }}")
          pct = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"::notice title=Coverage::行覆盖率 {pct:.2f}%（阈值 {threshold:.0f}%）")
          if pct < threshold:
              print(f"::error title=Coverage below threshold::行覆盖率 {pct:.2f}% 低于阈值 {threshold:.0f}%（强制门禁，ADR-0002）")
              sys.exit(1)
          PY
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: server/coverage.xml
          if-no-files-found: ignore

  # build + lint + typecheck，三项均阻断（ruff/mypy 存量均已清零，棘轮只进不退）
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies (locked, 含开发工具)
        # A7：运行时依赖按 lock 钉版；开发工具（ruff/mypy）仍走 dev 区间——
        # 它们不进镜像，钉版收益低，且 lint/typecheck 存量清零后新版能早暴露新规则
        run: pip install -r server/requirements.lock -r server/requirements-dev.txt
      - name: Build check (字节编译 + 迁移图)
        working-directory: server
        run: |
          python -m compileall -q app
          alembic heads
      - name: Lint (ruff, blocking)
        working-directory: server
        run: ruff check .
      - name: Typecheck (mypy, blocking)
        working-directory: server
        # check_mypy_env 同样**阻断**：它校验 mypy 能解析到第三方库的类型。
        # 探针失败说明这次 mypy 结果不可信（全被当成 Any），那种「绿」比红更危险。
        run: |
          python scripts/check_mypy_env.py
          mypy app

  # A7：依赖漏洞扫描（对全钉版 lock 扫，结果可复现）。起步为 warning 档
  # （continue-on-error）：先看清存量、修完已知项后再转阻断，与 lint/mypy
  # 当年"先基线后棘轮"的路数一致。
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (warning 档)
        # --no-deps：lock 已含全部传递依赖，无需现场解析
        run: |
          pip install pip-audit
          pip-audit --no-deps -r server/requirements.lock
