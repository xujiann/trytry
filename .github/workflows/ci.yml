name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # 块5：覆盖率门禁阈值。实测行覆盖率约 83%，已从 warning 切换为**强制门禁**：
  # 低于阈值即构建失败。阈值留 13 个百分点缓冲，避免正常波动误红。
  COVERAGE_MIN: "70"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r server/requirements.txt
      - name: Run tests with coverage
        working-directory: server
        # 端到端测试（tests/e2e，标记 e2e）默认跳过，需 --e2e 且已安装浏览器内核
        run: |
          python -m pytest tests/ -q \
            --cov=app --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Coverage gate (enforcing)
        working-directory: server
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          threshold = float("${{ env.COVERAGE_MIN }}")
          pct = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"::notice title=Coverage::行覆盖率 {pct:.2f}%（阈值 {threshold:.0f}%）")
          if pct < threshold:
              print(f"::error title=Coverage below threshold::行覆盖率 {pct:.2f}% 低于阈值 {threshold:.0f}%，构建失败")
              sys.exit(1)
          PY
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: server/coverage.xml
          if-no-files-found: ignore
