# A6：构建发布流水线——打 tag（v*）或手动触发时构建生产镜像并推送 GHCR。
# 有意的边界：**只产镜像，不做部署**（当前无可编程的目标环境）；
# 部署/迁移/回滚步骤见 docs/发布流程.md。
name: Build & Publish Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # 与 ci.yml 的 PYTHON_VERSION、两个 Dockerfile、pyproject.toml 同版
  # （tests/test_python_version_alignment.py 钉住 ci.yml 那份；改版本请一起改）
  PYTHON_VERSION: "3.12"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 门禁：单元 + 冒烟全绿才准出镜像（运行时依赖装 lock，和镜像内完全同版；
  # P2-26④ 后 lock 不含测试工具，pytest 由 dev 钉版提供）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies (locked, 含开发工具)
        run: pip install -r server/requirements.lock -r server/requirements-dev.txt
      - name: Run unit + smoke tests
        working-directory: server
        run: python -m pytest tests/ -q -m "not integration and not e2e"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata (tags = git tag + sha)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 镜像标签：git tag（v1.2.3）+ 完整 sha；手动触发时只有 sha。
          # 刻意**不打 latest**：回滚靠明确的版本 tag，"latest 指向谁"不该有歧义。
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
